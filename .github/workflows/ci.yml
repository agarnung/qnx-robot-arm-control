name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    name: POSIX build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y build-essential python3
      - name: Build POSIX control core
        run: make linux
      - name: Run tests
        run: make test
      - name: Run AddressSanitizer and UndefinedBehaviorSanitizer
        run: make -C control_core sanitize
      - name: Run GCC static analyzer
        run: make -C control_core analyze
